<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Love Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2f2a45;--bg:#2b2640;--card:#fbf3ea;--pri:#e58fa8;--blue:#7c8fe0;--green:#8fcfa8;--yellow:#f3d98b;--purple:#b7a6e8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Baloo 2','Comic Sans MS',system-ui,sans-serif;color:#f3ecff;background-color:var(--bg);
background-image:radial-gradient(#ffffff14 3px,transparent 3px),radial-gradient(#e58fa81c 3px,transparent 3px);background-size:40px 40px;background-position:0 0,20px 20px;min-height:100vh;font-size:17px}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
.card,.folder,.note,.file,.btn{color:var(--ink)}
.btn{border:3px solid var(--ink);background:#fbf3ea;border-radius:14px;padding:6px 14px;cursor:pointer;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:.08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.pri{background:var(--pri);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green)}
.btn.sm{padding:2px 10px;font-size:15px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;background:#fffaf3;color:#2f2a45;outline:none}
input:focus,textarea:focus{box-shadow:0 0 0 4px #74c0fc88}
label{display:block;font-weight:700;margin:10px 0 4px}
[hidden]{display:none!important}
.card{background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink)}

/* auth */
#auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
#auth .card{width:100%;max-width:400px;padding:22px;text-align:center}
#auth h1{margin:6px 0 0;font-size:34px;font-weight:800;color:var(--pri)}
#auth p.sub{margin:0 0 10px;opacity:.75}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1}
.tabs .on{background:var(--yellow)}
#auth form{text-align:left}
#auth .err{color:#c92a2a;font-weight:700;min-height:24px}
#auth .ok{color:#2b8a3e;font-weight:700}
.linkbtn{background:none;border:0;padding:0;color:#5c4fb0;text-decoration:underline;cursor:pointer;font-weight:700}
.notice{background:#fff3bf;border:3px solid var(--ink);border-radius:14px;padding:10px;margin:10px 0;text-align:left;font-size:15px}

/* app */
header{display:flex;gap:10px;align-items:center;padding:10px 16px;background:var(--blue);border-bottom:4px solid var(--ink);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .logo{font-weight:800;font-size:24px;color:#fff;text-shadow:2px 2px 0 var(--ink);cursor:pointer;white-space:nowrap}
header .search{flex:1;min-width:160px}
header .who{font-size:14px;color:#fff;font-weight:700;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:18px 14px 60px}
h2.title{margin:6px 0 14px;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.folder{position:relative;padding:16px 10px 12px;text-align:center;cursor:pointer;border:3px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);transition:.1s}
.folder:hover{transform:translateY(-4px) rotate(-1deg)}
.folder .ic{font-size:54px;line-height:1.1}
.folder .nm{font-weight:800;font-size:19px;word-break:break-word}
.folder .ct{font-size:14px;opacity:.75}
.folder .badge{position:absolute;top:6px;left:8px;font-size:18px}
.folder.new{background:#3a3458;color:#f3ecff;border-color:#8c82bd;box-shadow:5px 5px 0 #1f1b33;border-style:dashed;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:140px}
.folder.new .ic{font-size:44px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.split{display:grid;grid-template-columns:300px 1fr;gap:18px}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.notes{padding:12px;max-height:75vh;overflow:auto}
.note{padding:8px 10px;border:3px solid var(--ink);border-radius:14px;margin:8px 0;cursor:pointer;background:#f6ecdd}
.note.on{background:var(--yellow)}
.note b{display:block;word-break:break-word}
.note small{opacity:.7}
.editor{padding:16px}
.editor textarea{min-height:260px;resize:vertical;line-height:1.5}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{font-size:24px;border:3px solid transparent;background:none;border-radius:12px;cursor:pointer}
.moods button.sel{border-color:var(--ink);background:var(--yellow)}
.files{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.file{border:3px solid var(--ink);border-radius:12px;padding:6px 8px;background:#e6e9fb;max-width:200px;font-size:14px;word-break:break-all}
.file img{display:block;max-width:100%;max-height:110px;border-radius:8px;margin-bottom:4px}
.file a{color:var(--ink);font-weight:700}
.hint{padding:30px;text-align:center;opacity:.8}
.results{margin-top:20px}
.results .note{background:#fff}

/* modal */
#ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
#ov .card{width:100%;max-width:440px;padding:20px;max-height:92vh;overflow:auto}
#ov h2{margin:0 0 6px}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{width:44px;height:44px;border:3px solid transparent;border-radius:12px;background:#f1f3f5;font-size:24px;cursor:pointer}
.picker button.sel{border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px}
.chk input{width:22px;height:22px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
small.t{display:block;opacity:.7;margin-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--yellow);color:var(--ink);border:3px solid var(--ink);padding:10px 18px;border-radius:14px;z-index:30;font-weight:700;max-width:90%}
</style>
</head>
<body>

<!-- LOGIN / SIGNUP -->
<div id="auth">
  <div class="card">
    <div style="font-size:72px;line-height:1.1" aria-hidden="true">🥰</div>
    <h1>My Love Notes</h1>
    <p class="sub">Un rahasiyam, un diary 🔒</p>
    <div class="notice" id="setup-notice" hidden>
      ⚙️ Firebase setup innum mudiyala. <b>index.html</b> file-la mela irukkura <b>firebaseConfig</b>-a unga Firebase details-oda maathunga.
    </div>
    <div class="tabs">
      <button class="btn on" id="tab-login" type="button">Login</button>
      <button class="btn" id="tab-signup" type="button">Sign up</button>
    </div>
    <form id="auth-form">
      <label for="a-email">Email</label>
      <input type="email" id="a-email" required autocomplete="email" placeholder="you@mail.com">
      <label for="a-pass">Password</label>
      <input type="password" id="a-pass" required minlength="6" autocomplete="current-password" placeholder="min 6 characters">
      <div class="err" id="a-err"></div>
      <button class="btn pri" style="width:100%" id="a-go">Login</button>
      <p style="text-align:center;margin:12px 0 0" id="forgot-wrap"><button type="button" class="linkbtn" id="forgot">Password maranthuttingala?</button></p>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <header>
    <span class="logo" id="logo">🥰 My Love Notes</span>
    <input type="text" class="search" id="q" placeholder="🔍 Search..." autocomplete="off">
    <span class="who" id="who"></span>
    <button class="btn sm" id="logout">Logout</button>
  </header>
  <main id="main"></main>
</div>

<div id="ov" hidden></div>
<div id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =====================================================================
   STEP: Firebase console-la kudukkura firebaseConfig-a inga paste pannunga.
   (ippo irukkura PASTE_... values-a thookki, unga real values podunga)
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyACYRRgwkybKfqfiaCsr1ADuSBTpo3eLS4",
  authDomain: "my-love-notes-jj.firebaseapp.com",
  projectId: "my-love-notes-jj",
  storageBucket: "my-love-notes-jj.firebasestorage.app",
  messagingSenderId: "1076332360985",
  appId: "1:1076332360985:web:c9d364d8a0397f54070188"
};
/* ===================================================================== */

const configured = !String(firebaseConfig.apiKey).startsWith('PASTE');
let auth = null, db = null;
if (configured) { const app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const ICONS = ['📁','📔','⭐','🌈','🎈','🍕','🐶','🐱','🚀','🎮','🎵','⚽','🌸','🍦','💖','🔒'];
const COLORS = ['#f3d98b','#e8a0a0','#9fb4ee','#9fd8b5','#c9b8f0','#f0b98a','#8fd3dc','#efb3cf'];
const MOODS = ['😀','😊','😐','😢','😡','😴'];

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
function modal(html){const o=$('#ov');o.innerHTML='<div class="card">'+html+'</div>';o.hidden=false;return o.firstChild}
function closeModal(){$('#ov').hidden=true;$('#ov').innerHTML=''}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});
const blobToDataURL = b => new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});

/* ---------- crypto (locked folders) ---------- */
const enc = new TextEncoder(), dec = new TextDecoder();
const toB64 = buf => {const a=new Uint8Array(buf);let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)};
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function baseKey(pw){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])}
async function deriveKey(pw,salt){return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},await baseKey(pw),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptBytes(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv:toB64(iv),data:toB64(ct)}}
async function decryptBytes(key,iv,data){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(iv)},key,fromB64(data)))}
async function encryptObj(key,obj){return encryptBytes(key,enc.encode(JSON.stringify(obj)))}
async function decryptObj(key,iv,data){return JSON.parse(dec.decode(await decryptBytes(key,iv,data)))}

/* ---------- state ---------- */
let me = null, myEmail = '';
let data = {folders:[]};      // raw folders (plain: has notes[]; locked: salt/iv/data)
let unlocked = {};            // id -> {key, content:{name,icon,color,notes}, pw}
let view = {name:'home'};
let draft = null;
let blobCache = {};           // fileId -> url to show

const col  = n => collection(db,'users',me,n);
const dref = (n,id) => doc(db,'users',me,n,id);

const visibleFolders = () => {
  const out=[];
  for(const f of data.folders){
    if(f.locked){const u=unlocked[f.id];if(u)out.push({id:f.id,c:u.content,locked:true})}
    else out.push({id:f.id,c:f,locked:false});
  }
  return out;
};
const findFolder = id => visibleFolders().find(x=>x.id===id);
const stripFiles = files => (files||[]).map(({id,name,type,size})=>({id,name,type,size}));
const stripNote = n => ({title:n.title||'',body:n.body||'',mood:n.mood||'',created:n.created||Date.now(),updated:n.updated||Date.now(),files:stripFiles(n.files)});

/* ---------- Firestore I/O ---------- */
async function putFolder(raw){
  if(raw.locked) await setDoc(dref('folders',raw.id),{locked:true,salt:raw.salt,iv:raw.iv,data:raw.data,created:raw.created});
  else await setDoc(dref('folders',raw.id),{locked:false,name:raw.name,icon:raw.icon,color:raw.color,created:raw.created});
}
async function saveFolderMeta(fv){
  const raw=data.folders.find(x=>x.id===fv.id);
  if(fv.locked){
    const u=unlocked[fv.id];
    const e=await encryptObj(u.key,{name:u.content.name,icon:u.content.icon,color:u.content.color});
    raw.iv=e.iv;raw.data=e.data;
  }
  await putFolder(raw);
}
async function writeNote(fv,note){
  const s=stripNote(note);
  if(fv.locked){
    const e=await encryptObj(unlocked[fv.id].key,s);
    await setDoc(dref('notes',note.id),{folderId:fv.id,locked:true,updated:s.updated,iv:e.iv,data:e.data});
  }else await setDoc(dref('notes',note.id),{folderId:fv.id,locked:false,...s});
}
async function writeBlob(fv,file){
  if(fv.locked){
    const bytes=new Uint8Array(await (await fetch(file.data)).arrayBuffer());
    const e=await encryptBytes(unlocked[fv.id].key,bytes);
    await setDoc(dref('blobs',file.id),{folderId:fv.id,locked:true,iv:e.iv,data:e.data});
  }else await setDoc(dref('blobs',file.id),{folderId:fv.id,locked:false,data:file.data});
}
async function getBlobUrl(fv,file){
  if(blobCache[file.id])return blobCache[file.id];
  const s=await getDoc(dref('blobs',file.id));
  if(!s.exists())return null;
  const v=s.data();let url;
  if(v.locked){
    const bytes=await decryptBytes(unlocked[fv.id].key,v.iv,v.data);
    url=URL.createObjectURL(new Blob([bytes],{type:file.type||'application/octet-stream'}));
  }else url=v.data;
  blobCache[file.id]=url;return url;
}
async function loadAll(){
  const [fs,ns]=await Promise.all([getDocs(col('folders')),getDocs(query(col('notes'),where('locked','==',false)))]);
  const folders=fs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0));
  for(const f of folders)if(!f.locked)f.notes=[];
  for(const d of ns.docs){
    const v=d.data();const f=folders.find(x=>x.id===v.folderId);
    if(f&&!f.locked){const {folderId,locked,...n}=v;f.notes.push({files:[],...n,id:d.id})}
  }
  if(!folders.length){
    const f={id:uid(),locked:false,name:'My Diary',icon:'📔',color:COLORS[0],created:Date.now(),notes:[]};
    await putFolder(f);folders.push(f);
  }
  data={folders};
}
async function unlockWith(f,pw){
  const key=await deriveKey(pw,fromB64(f.salt));
  const meta=await decryptObj(key,f.iv,f.data);   // throws when password is wrong
  const snap=await getDocs(query(col('notes'),where('folderId','==',f.id)));
  const notes=[];
  for(const d of snap.docs){
    const v=d.data();if(!v.locked)continue;
    try{const n=await decryptObj(key,v.iv,v.data);notes.push({files:[],...n,id:d.id})}catch(e){}
  }
  return {key,content:{...meta,notes},pw};
}

/* ---------- auth ---------- */
let mode='login';
function setMode(m){
  mode=m;
  $('#tab-login').classList.toggle('on',m==='login');
  $('#tab-signup').classList.toggle('on',m==='signup');
  $('#a-go').textContent=m==='login'?'Login':'Create account';
  $('#a-pass').autocomplete=m==='login'?'current-password':'new-password';
  $('#forgot-wrap').hidden=m!=='login';
  $('#a-err').textContent='';$('#a-err').className='err';
}
$('#tab-login').onclick=()=>setMode('login');
$('#tab-signup').onclick=()=>setMode('signup');
function authMsg(x){
  const c=x&&x.code||'';
  if(c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/user-not-found')return 'Email illa password thappu 😕';
  if(c==='auth/email-already-in-use')return 'Indha email already irukku. Login pannunga.';
  if(c==='auth/weak-password')return 'Password kuranja 6 characters venum.';
  if(c==='auth/invalid-email')return 'Email sariya illa.';
  if(c==='auth/too-many-requests')return 'Neraiya try pannitteenga. Konjam neram kazhichu try pannunga.';
  if(c==='auth/network-request-failed')return 'Internet connection check pannunga.';
  if(c==='auth/unauthorized-domain')return 'Indha website Firebase-la authorize aagala (Authorized domains-la add pannunga).';
  return 'Error: '+(x&&x.message||x);
}
$('#auth-form').addEventListener('submit',async e=>{
  e.preventDefault();if(!configured)return;
  const email=$('#a-email').value.trim(),pw=$('#a-pass').value,err=$('#a-err');
  err.textContent='';err.className='err';$('#a-go').disabled=true;
  try{
    if(mode==='signup')await createUserWithEmailAndPassword(auth,email,pw);
    else await signInWithEmailAndPassword(auth,email,pw);
  }catch(x){err.textContent=authMsg(x)}
  finally{$('#a-go').disabled=false}
});
$('#forgot').onclick=async()=>{
  const err=$('#a-err'),email=$('#a-email').value.trim();
  if(!configured)return;
  if(!email){err.className='err';err.textContent='Mudhalla email type pannunga, appuram click pannunga.';return}
  try{await sendPasswordResetEmail(auth,email);err.className='ok';err.textContent='Reset link mail-ku anuppitten ✅ (Spam folder-um paarunga)'}
  catch(x){err.className='err';err.textContent=authMsg(x)}
};
function showAuth(){
  me=null;data={folders:[]};unlocked={};draft=null;blobCache={};view={name:'home'};
  $('#app').hidden=true;$('#auth').hidden=false;$('#a-pass').value='';$('#q').value='';
}
async function startSession(user){
  me=user.uid;myEmail=user.email||'';
  unlocked={};view={name:'home'};draft=null;blobCache={};
  $('#auth').hidden=true;$('#app').hidden=false;$('#who').textContent=myEmail;$('#q').value='';
  $('#main').innerHTML='<div class="hint">Loading... ⏳</div>';
  try{await loadAll()}
  catch(x){
    $('#main').innerHTML='<div class="card" style="padding:20px"><h2 style="margin-top:0">😕 Data load aagala</h2><p>'+esc(x.message||x)+'</p><p>Firestore <b>Rules</b> sariya publish pannirukkeengala nu check pannunga.</p></div>';
    return;
  }
  render();
}
if(configured)onAuthStateChanged(auth,user=>{if(user)startSession(user);else showAuth()});
else{$('#setup-notice').hidden=false;$('#a-go').disabled=true}
$('#logout').onclick=async()=>{
  if(draft?.dirty&&!confirm('Save pannala. Podhum nu logout pannalama?'))return;
  await signOut(auth);
};
$('#logo').onclick=()=>goHome();

/* ---------- navigation ---------- */
function goHome(){
  if(draft?.dirty&&!confirm('Save pannala. Podhum nu poidalama?'))return;
  draft=null;view={name:'home'};unlocked={};blobCache={};$('#q').value='';render();
}
function openFolder(id){view={name:'folder',id};draft=null;$('#q').value='';render()}

/* ---------- search (also reveals secret folders) ---------- */
let st,searchTok=0;
$('#q').addEventListener('input',()=>{clearTimeout(st);st=setTimeout(onSearch,350);if(view.name==='folder')render()});
async function onSearch(){
  const q=$('#q').value;
  if(view.name!=='home'){render();return}
  const tok=++searchTok;
  const next={};
  if(q){
    for(const f of data.folders.filter(f=>f.locked)){
      if(unlocked[f.id]&&unlocked[f.id].pw===q){next[f.id]=unlocked[f.id];continue}
      try{next[f.id]=await unlockWith(f,q)}catch(e){/* wrong password = stays hidden */}
      if(tok!==searchTok)return;
    }
  }
  if(tok!==searchTok)return;
  unlocked=next;
  render();
}

/* ---------- render ---------- */
function render(){
  if(!me)return;
  const m=$('#main');
  if(view.name==='home')m.innerHTML=renderHome();
  else{
    const f=findFolder(view.id);
    if(!f){view={name:'home'};m.innerHTML=renderHome();return}
    m.innerHTML=renderFolder(f);
  }
}
function renderHome(){
  const q=$('#q').value.trim().toLowerCase();
  const all=visibleFolders();
  const list=q?all.filter(f=>f.locked||f.c.name.toLowerCase().includes(q)):all;
  let h='<h2 class="title">📚 En Folders</h2><div class="grid">';
  for(const f of list){
    h+=`<div class="folder" style="background:${esc(f.c.color)}" data-act="open-folder" data-id="${f.id}">
      ${f.locked?'<span class="badge">🔒</span>':''}
      <div class="ic">${esc(f.c.icon)}</div><div class="nm">${esc(f.c.name)}</div>
      <div class="ct">${f.c.notes.length} notes</div></div>`;
  }
  if(!q)h+=`<div class="folder new" data-act="new-folder"><div class="ic">➕</div><div class="nm">New Folder</div></div>`;
  h+='</div>';
  if(q){
    const hits=[];
    for(const f of all)for(const n of f.c.notes){
      if(((n.title||'')+' '+(n.body||'')).toLowerCase().includes(q))hits.push({f,n});
    }
    if(hits.length){
      h+='<div class="results"><h2 class="title">📝 Notes found</h2>';
      for(const {f,n} of hits)h+=`<div class="note" data-act="open-result" data-id="${f.id}" data-nid="${n.id}"><b>${esc(n.mood||'')} ${esc(n.title||'(no title)')}</b><small>${esc(f.c.icon)} ${esc(f.c.name)} · ${new Date(n.updated).toLocaleDateString()}</small></div>`;
      h+='</div>';
    }
  }
  return h;
}
function renderFolder(f){
  const q=$('#q').value.trim().toLowerCase();
  let notes=[...f.c.notes].sort((a,b)=>b.updated-a.updated);
  if(q)notes=notes.filter(n=>((n.title||'')+' '+(n.body||'')).toLowerCase().includes(q));
  let h=`<div class="bar">
    <button class="btn" data-act="back">⬅ Back</button>
    <h2 class="title grow" style="margin:0">${f.locked?'🔒 ':''}${esc(f.c.icon)} ${esc(f.c.name)}</h2>
    <button class="btn sm" data-act="edit-folder">✏️ Edit</button>
    ${f.locked
      ?'<button class="btn sm" data-act="unlock-folder">🔓 Remove lock</button><button class="btn sm blue" data-act="hide-folder">🙈 Hide</button>'
      :'<button class="btn sm" data-act="lock-folder">🔒 Lock</button>'}
    <button class="btn sm pri" data-act="del-folder">🗑 Delete</button>
  </div>
  <div class="split"><div class="card notes">
    <button class="btn green" style="width:100%" data-act="new-note">➕ New note</button>`;
  if(!notes.length)h+='<div class="hint">Note illa 🙈</div>';
  for(const n of notes)h+=`<div class="note ${draft&&draft.id===n.id?'on':''}" data-act="open-note" data-id="${n.id}"><b>${esc(n.mood||'')} ${esc(n.title||'(no title)')}</b><small>${new Date(n.updated).toLocaleString()}${n.files?.length?' · 📎'+n.files.length:''}</small></div>`;
  h+='</div><div class="card editor">';
  if(!draft)h+='<div class="hint">👈 Oru note select pannunga, illana puthusa create pannunga ✨</div>';
  else{
    h+=`<label>Title</label><input type="text" id="n-title" maxlength="80" value="${esc(draft.title)}" placeholder="Innaiku enna nadanthuchu?">
    <label>Mood</label><div class="moods">${MOODS.map(m=>`<button type="button" data-act="mood" data-v="${m}" class="${draft.mood===m?'sel':''}">${m}</button>`).join('')}</div>
    <label>Diary</label><textarea id="n-body" placeholder="Inge ezhuthunga...">${esc(draft.body)}</textarea>
    <label>📎 Files (photo auto-shrink aagum. Mattha files max 550KB)</label>
    <input type="file" id="n-file" multiple>
    <div class="files">${draft.files.map((x,i)=>`<div class="file">${x.data&&(x.type||'').startsWith('image/')?`<img src="${x.data}" alt="">`:''}${x.data?`<a href="${x.data}" download="${esc(x.name)}" target="_blank" rel="noopener">${esc(x.name)}</a>`:`<span>⏳ ${esc(x.name)}</span>`}<small class="t">${Math.round((x.size||0)/1024)} KB</small><button class="btn sm" data-act="rm-file" data-i="${i}">✖</button></div>`).join('')}</div>
    <div class="row" style="justify-content:space-between"><button class="btn pri" data-act="del-note">🗑 Delete</button><button class="btn green" data-act="save-note">💾 Save</button></div>`;
  }
  return h+'</div></div>';
}

/* ---------- notes ---------- */
function openNote(id){
  const f=findFolder(view.id);const n=f?.c.notes.find(n=>n.id===id);if(!n)return;
  draft={...JSON.parse(JSON.stringify(n)),removed:[],dirty:false};
  draft.files=(draft.files||[]).map(x=>({...x,data:blobCache[x.id]||null}));
  render();loadDraftFiles();
}
async function loadDraftFiles(){
  const d=draft,fv=findFolder(view.id);if(!d||!fv)return;
  let changed=false;
  for(const x of d.files){
    if(x.data||x.fresh)continue;
    try{x.data=await getBlobUrl(fv,x);changed=true}catch(e){}
    if(draft!==d)return;
  }
  if(changed&&draft===d)render();
}
async function prepFile(file){
  if((file.type||'').startsWith('image/')&&file.type!=='image/gif'){
    const bmp=await createImageBitmap(file);
    let max=1280,q=.75,out='';
    for(let i=0;i<6;i++){
      const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(bmp.width*sc));c.height=Math.max(1,Math.round(bmp.height*sc));
      c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
      out=c.toDataURL('image/jpeg',q);
      if(out.length<700000)break;
      max*=.75;q=Math.max(.5,q-.05);
    }
    if(out.length>=900000)return null;
    return {name:file.name.replace(/\.\w+$/,'')+'.jpg',type:'image/jpeg',data:out,size:Math.round(out.length*.75)};
  }
  if(file.size>550*1024)return null;
  return {name:file.name,type:file.type||'application/octet-stream',data:await blobToDataURL(file),size:file.size};
}

/* ---------- click handling ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el||!me)return;
  try{await handleAct(el)}catch(x){console.error(x);toast('Error: '+(x.message||x))}
});
async function handleAct(el){
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='new-folder')return folderModal(null);
  if(act==='open-folder')return openFolder(id);
  if(act==='open-result'){view={name:'folder',id};$('#q').value='';draft=null;render();return openNote(el.dataset.nid)}
  if(act==='back')return goHome();
  const f=view.name==='folder'?findFolder(view.id):null;
  if(!f)return;
  if(act==='edit-folder')return folderModal(f);
  if(act==='lock-folder')return lockModal(f);
  if(act==='unlock-folder')return removeLock(f);
  if(act==='hide-folder'){unlocked={};blobCache={};draft=null;view={name:'home'};$('#q').value='';render();return toast('Folder maraichachu 🙈')}
  if(act==='del-folder'){
    if(!confirm(`"${f.c.name}" folder-a, ulla ella notes-oda delete pannalama?`))return;
    toast('Deleting... ⏳');
    const ns=await getDocs(query(col('notes'),where('folderId','==',f.id)));
    for(const d of ns.docs)await deleteDoc(d.ref);
    const bs=await getDocs(query(col('blobs'),where('folderId','==',f.id)));
    for(const d of bs.docs)await deleteDoc(d.ref);
    await deleteDoc(dref('folders',f.id));
    data.folders=data.folders.filter(x=>x.id!==f.id);delete unlocked[f.id];
    draft=null;view={name:'home'};render();return toast('Folder deleted');
  }
  if(act==='new-note'){
    if(draft?.dirty&&!confirm('Save pannala. Podhum nu poidalama?'))return;
    draft={id:uid(),title:'',body:'',mood:'😊',files:[],removed:[],created:Date.now(),updated:Date.now(),isNew:true,dirty:false};
    render();return;
  }
  if(act==='open-note'){
    if(draft?.dirty&&draft.id!==id&&!confirm('Save pannala. Podhum nu poidalama?'))return;
    return openNote(id);
  }
  if(act==='mood'){draft.mood=el.dataset.v;draft.dirty=true;render();return}
  if(act==='rm-file'){
    const x=draft.files.splice(+el.dataset.i,1)[0];
    if(x&&!x.fresh)draft.removed.push(x.id);
    draft.dirty=true;render();return;
  }
  if(act==='save-note'){
    if(!draft.title.trim()&&!draft.body.trim()&&!draft.files.length)return toast('Edhavadhu ezhuthunga 😅');
    const note={id:draft.id,title:draft.title,body:draft.body,mood:draft.mood,created:draft.created,updated:Date.now(),files:stripFiles(draft.files)};
    toast('Saving... ⏳');
    el.disabled=true;
    try{
      for(const x of draft.files)if(x.fresh){await writeBlob(f,x);blobCache[x.id]=x.data}
      for(const rid of draft.removed)await deleteDoc(dref('blobs',rid));
      await writeNote(f,note);
    }catch(x){el.disabled=false;return toast('Save aagala: '+(x.message||x))}
    const i=f.c.notes.findIndex(n=>n.id===note.id);
    if(i>=0)f.c.notes[i]=note;else f.c.notes.push(note);
    draft={...note,files:draft.files.map(x=>({id:x.id,name:x.name,type:x.type,size:x.size,data:x.data})),removed:[],isNew:false,dirty:false};
    render();return toast('Saved ✅');
  }
  if(act==='del-note'){
    if(!confirm('Indha note-a delete pannalama?'))return;
    const saved=f.c.notes.find(n=>n.id===draft.id);
    if(saved){
      toast('Deleting... ⏳');
      const ids=new Set([...(saved.files||[]).map(x=>x.id),...(draft.removed||[])]);
      for(const bid of ids)await deleteDoc(dref('blobs',bid));
      await deleteDoc(dref('notes',saved.id));
      f.c.notes=f.c.notes.filter(n=>n.id!==saved.id);
    }
    draft=null;render();return toast('Note deleted');
  }
}
document.addEventListener('input',e=>{
  if(!draft)return;
  if(e.target.id==='n-title'){draft.title=e.target.value;draft.dirty=true}
  if(e.target.id==='n-body'){draft.body=e.target.value;draft.dirty=true}
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='n-file'||!draft)return;
  const files=[...e.target.files];
  toast('File ready aagudhu... ⏳');
  for(const file of files){
    try{
      const p=await prepFile(file);
      if(!p){toast('Romba periya file: '+file.name+' (max 550KB)');continue}
      draft.files.push({id:uid(),fresh:true,...p});
    }catch(x){toast('Indha file add panna mudiyala: '+file.name)}
  }
  draft.dirty=true;render();
});
window.addEventListener('beforeunload',e=>{if(draft?.dirty){e.preventDefault();e.returnValue=''}});

/* ---------- folder modals ---------- */
function folderModal(f){
  let icon=f?f.c.icon:ICONS[0],color=f?f.c.color:COLORS[0];
  const box=modal(`<h2>${f?'✏️ Edit folder':'➕ New folder'}</h2>
    <label>Name</label><input type="text" id="fm-name" maxlength="30" value="${esc(f?f.c.name:'')}" placeholder="Folder name">
    <label>Symbol</label><div class="picker" id="fm-icons">${ICONS.map(i=>`<button type="button" data-v="${i}" class="${i===icon?'sel':''}">${i}</button>`).join('')}</div>
    <label>Colour</label><div class="picker" id="fm-colors">${COLORS.map(c=>`<button type="button" data-v="${c}" style="background:${c}" class="${c===color?'sel':''}"></button>`).join('')}</div>
    ${f?'':`<label class="chk"><input type="checkbox" id="fm-lock"> 🔒 Indha folder-a lock panni maraikanum</label>
    <div id="fm-pw" hidden><label>Secret password</label><input type="password" id="fm-p1" autocomplete="new-password"><label>Confirm password</label><input type="password" id="fm-p2" autocomplete="new-password">
    <small class="t">Search box-la indha password type panna mattum folder theriyum. Maranthuta recover panna mudiyathu!</small></div>`}
    <div class="row"><button class="btn" id="fm-cancel">Cancel</button><button class="btn green" id="fm-ok">Save</button></div>`);
  const pick=(sel,fn)=>box.querySelector(sel).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;box.querySelectorAll(sel+' button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');fn(b.dataset.v)});
  pick('#fm-icons',v=>icon=v);pick('#fm-colors',v=>color=v);
  const lk=box.querySelector('#fm-lock');if(lk)lk.onchange=()=>box.querySelector('#fm-pw').hidden=!lk.checked;
  box.querySelector('#fm-cancel').onclick=closeModal;
  const ok=box.querySelector('#fm-ok');
  ok.onclick=async()=>{
    const name=box.querySelector('#fm-name').value.trim();if(!name)return toast('Name venum 🙂');
    ok.disabled=true;
    try{
      if(f){f.c.name=name;f.c.icon=icon;f.c.color=color;await saveFolderMeta(f);closeModal();render();return}
      const created=Date.now(),id=uid();
      if(lk&&lk.checked){
        const p1=box.querySelector('#fm-p1').value,p2=box.querySelector('#fm-p2').value;
        if(p1.length<4){ok.disabled=false;return toast('Password kuranja 4 characters venum')}
        if(p1!==p2){ok.disabled=false;return toast('Rendu password-um match aagala')}
        const salt=crypto.getRandomValues(new Uint8Array(16));
        const key=await deriveKey(p1,salt);const e=await encryptObj(key,{name,icon,color});
        const raw={id,locked:true,salt:toB64(salt),iv:e.iv,data:e.data,created};
        await putFolder(raw);data.folders.push(raw);
        closeModal();render();
        return toast('Locked! 🔒 Search-la password type panna thaan theriyum');
      }
      const raw={id,locked:false,name,icon,color,created,notes:[]};
      await putFolder(raw);data.folders.push(raw);closeModal();render();
    }catch(x){ok.disabled=false;toast('Save aagala: '+(x.message||x))}
  };
}
function lockModal(f){
  const box=modal(`<h2>🔒 Lock "${esc(f.c.name)}"</h2>
    <label>Secret password</label><input type="password" id="lk1" autocomplete="new-password">
    <label>Confirm password</label><input type="password" id="lk2" autocomplete="new-password">
    <small class="t">Lock aanathum folder maraindhidum. Home-la search box-la indha password type pannunga, folder thirumba varum. Password maranthuta recover panna mudiyathu!</small>
    <div class="row"><button class="btn" id="lk-c">Cancel</button><button class="btn pri" id="lk-ok">Lock it</button></div>`);
  box.querySelector('#lk-c').onclick=closeModal;
  const btn=box.querySelector('#lk-ok');
  btn.onclick=async()=>{
    const p1=box.querySelector('#lk1').value,p2=box.querySelector('#lk2').value;
    if(p1.length<4)return toast('Password kuranja 4 characters venum');
    if(p1!==p2)return toast('Rendu password-um match aagala');
    btn.disabled=true;toast('Locking... ⏳');
    try{
      const idx=data.folders.findIndex(x=>x.id===f.id),raw=data.folders[idx];
      const salt=crypto.getRandomValues(new Uint8Array(16));
      const key=await deriveKey(p1,salt);
      for(const n of raw.notes){
        for(const file of n.files||[]){
          const url=await getBlobUrl(f,file);if(!url)continue;
          const bytes=new Uint8Array(await (await fetch(url)).arrayBuffer());
          const e=await encryptBytes(key,bytes);
          await setDoc(dref('blobs',file.id),{folderId:f.id,locked:true,iv:e.iv,data:e.data});
        }
        const en=await encryptObj(key,stripNote(n));
        await setDoc(dref('notes',n.id),{folderId:f.id,locked:true,updated:n.updated||0,iv:en.iv,data:en.data});
      }
      const meta=await encryptObj(key,{name:raw.name,icon:raw.icon,color:raw.color});
      const lockedRaw={id:raw.id,locked:true,salt:toB64(salt),iv:meta.iv,data:meta.data,created:raw.created};
      await putFolder(lockedRaw);data.folders[idx]=lockedRaw;
    }catch(x){btn.disabled=false;return toast('Lock aagala: '+(x.message||x))}
    closeModal();draft=null;view={name:'home'};$('#q').value='';unlocked={};blobCache={};render();
    toast('Locked! 🔒 Search-la password type panni thirumba paarunga');
  };
}
async function removeLock(f){
  if(!confirm('Lock-a edukkalama? Folder normal-a ellarukkum theriyum.'))return;
  toast('Unlocking... ⏳');
  try{
    const u=unlocked[f.id],idx=data.folders.findIndex(x=>x.id===f.id),raw=data.folders[idx];
    for(const n of u.content.notes){
      for(const file of n.files||[]){
        const url=await getBlobUrl(f,file);if(!url)continue;
        const du=url.startsWith('data:')?url:await blobToDataURL(await (await fetch(url)).blob());
        await setDoc(dref('blobs',file.id),{folderId:f.id,locked:false,data:du});
      }
      await setDoc(dref('notes',n.id),{folderId:f.id,locked:false,...stripNote(n)});
    }
    const plain={id:f.id,locked:false,name:u.content.name,icon:u.content.icon,color:u.content.color,created:raw.created,notes:u.content.notes};
    await putFolder(plain);data.folders[idx]=plain;delete unlocked[f.id];
  }catch(x){return toast('Lock edukka mudiyala: '+(x.message||x))}
  render();toast('Lock removed 🔓');
}
</script>
